name: Release VSIX

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package VSIX
        run: vsce package --no-dependencies

      - name: Get version info
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Release via Gitea API
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          GITEA_URL="http://office.trollgames.co.kr:3000"
          REPO="trollgames/AutoAntigravity"
          VSIX_FILE="auto-antigravity-${VERSION}.vsix"

          # Create Release
          RELEASE_RESPONSE=$(curl -s -X POST \
            "${GITEA_URL}/api/v1/repos/${REPO}/releases" \
            -H "Authorization: token ${RELEASE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"tag_name\": \"${TAG_NAME}\",
              \"name\": \"Release ${TAG_NAME}\",
              \"body\": \"## AutoAntigravity ${VERSION}\n\n### 설치 방법\n1. 아래 .vsix 파일을 다운로드합니다.\n2. VS Code에서 Extensions: Install from VSIX... 명령을 실행합니다.\n3. 다운로드한 .vsix 파일을 선택하여 설치합니다.\",
              \"draft\": false,
              \"prerelease\": false
            }")

          # Extract release ID
          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Created release ID: ${RELEASE_ID}"

          # Upload VSIX as attachment
          curl -s -X POST \
            "${GITEA_URL}/api/v1/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${VSIX_FILE}" \
            -H "Authorization: token ${RELEASE_TOKEN}" \
            -H "Content-Type: multipart/form-data" \
            -F "attachment=@${VSIX_FILE}" 

          echo "✅ Release ${TAG_NAME} created with ${VSIX_FILE} attached!"
